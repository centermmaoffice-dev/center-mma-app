<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>CENTER MMA — Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#151515;border:1px solid #272727;border-radius:14px;padding:24px;text-align:center}
    h1{margin:0 0 10px;font-size:26px}
    p{color:#999;line-height:1.6}
    button{border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>CENTER MMA</h1>
    <p>You are offline. The app shell is available, but live club data requires an internet connection.</p>
    <button onclick="location.reload()">TRY AGAIN</button>
  </div>
</body>
</html>
