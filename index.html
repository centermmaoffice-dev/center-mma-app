<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTER MMA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 28px 22px;
      border: 1px solid #333;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 25px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">CENTER MMA</div>

    <div class="subtitle">VIENNA • MMA • GRAPPLING</div>

    <div class="card">

      <h1>Welcome</h1>

      <p>
        Willkommen bei CENTER MMA.<br>
        Dein persönlicher Mitgliederbereich.
      </p>

      <button onclick="alert('Login kommt als nächstes')">
        LOGIN
      </button>

    </div>

    <div class="footer">
      CENTER MMA • Vienna
    </div>

  </div>

</body>
</html>
